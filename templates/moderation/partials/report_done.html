{% comment "usage" %}
신고 접수 완료 (HTMX 신고 성공 시 #report-form-root 를 교체)
컨텍스트: back_url
{% endcomment %}
<div id="report-form-root" class="empty-state px-0 py-6" role="status">
  <span class="mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-brand-50 text-brand-700 ring-1 ring-inset ring-brand-100">
    {% include "components/icon.html" with name="check" class="h-8 w-8" stroke="2.25" %}
  </span>
  <p class="empty-state-title">신고를 접수했어요</p>
  <p class="empty-state-desc">운영팀이 꼼꼼히 확인하고 조치할게요.<br>알려 주셔서 고마워요.</p>
  <button type="button" class="btn btn-primary btn-block mt-6" data-modal-close>확인</button>
</div>
