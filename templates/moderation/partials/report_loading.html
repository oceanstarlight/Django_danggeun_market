{% comment "usage" %}
신고 모달 로딩 skeleton (modal body_template 으로 넣어 두면 HTMX가 폼으로 교체해요)
모양은 폼과 같게: 신고 대상 44px · 사유 줄 5개 · 입력칸 · 버튼 두 개
{% endcomment %}
<div class="space-y-2" aria-busy="true" aria-label="불러오는 중">
  <span class="skeleton h-11 w-full"></span>
  <span class="skeleton skeleton-text !mt-5 w-1/4"></span>
  {% for i in "12345" %}<span class="skeleton h-16 w-full"></span>{% endfor %}
  <span class="skeleton skeleton-text !mt-5 w-1/3"></span>
  <span class="skeleton h-28 w-full"></span>
  <span class="flex gap-2 pt-3"><span class="skeleton h-11 flex-1"></span><span class="skeleton h-11 flex-1"></span></span>
</div>
