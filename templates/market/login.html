{% load static %}
<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        로그인
    </title>

    <link rel="stylesheet" href="{% static 'market/css/style.css' %}">

</head>


<body>

<div class="site">


{% include "market/header.html" %}


<main class="main">

    <div class="form-card narrow">


        <h1 class="section-title">
            로그인
        </h1>


        {% for message in messages %}

            <p class="alert">
                {{ message }}
            </p>

        {% endfor %}


        <form method="post" class="form">

            {% csrf_token %}


            <p>

                <label>
                    아이디
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="아이디를 입력하세요"
                    required
                >

            </p>


            <p>

                <label>
                    비밀번호
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="비밀번호를 입력하세요"
                    required
                >

            </p>


            <button type="submit" class="btn btn-primary btn-lg btn-block">
                로그인
            </button>


        </form>


        <p class="form-footer">

            회원이 아니신가요?

            <a href="{% url 'signup' %}">
                회원가입
            </a>

        </p>


    </div>

</main>


</div>

</body>

</html>
